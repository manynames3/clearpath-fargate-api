services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clearpath
      POSTGRES_USER: clearpath
      POSTGRES_PASSWORD: clearpath
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearpath -d clearpath"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
