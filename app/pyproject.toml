[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clearpath-api"
version = "0.1.0"
description = "Clearpath Lead Intelligence API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "uvloop>=0.19.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "asyncpg>=0.29.0",
  "boto3>=1.34.0",
  "pydantic-settings>=2.0.0",
  "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite",
  "alembic",
  "checkov",
  "factory-boy",
  "httpx",
  "pytest",
  "pytest-asyncio",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
