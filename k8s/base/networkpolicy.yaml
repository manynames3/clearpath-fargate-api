apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clearpath-api-default
  namespace: clearpath-api
  labels:
    app.kubernetes.io/name: clearpath-api
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: clearpath-api
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
