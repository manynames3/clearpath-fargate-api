apiVersion: apps/v1
kind: Deployment
metadata:
  name: clearpath-api
  namespace: clearpath-api
  labels:
    app.kubernetes.io/name: clearpath-api
    app.kubernetes.io/component: api
  annotations:
    checkov.io/skip1: CKV_K8S_43=Digest pinning is done by the image promotion pipeline; source manifests use a readable semantic tag for portfolio review.
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: clearpath-api
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clearpath-api
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      serviceAccountName: clearpath-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: clearpath-api:0.1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: clearpath-api-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1024Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
